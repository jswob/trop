<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#101419" />
		<!--
			The device's appearance, on the root before anything paints, so a device that chose light
			never flashes dark. It reads what `useAppearance` writes and draws what
			`applyAppearance` draws (`@app/ui/views/appearance`); `src/boot.test.ts` runs it.
		-->
		<script>
			try {
				if (localStorage.getItem('app-appearance') === 'light') {
					document.documentElement.dataset.theme = 'light';
					document.querySelector('meta[name="theme-color"]').content = '#f5f7f9';
				}
			} catch {
				/* Storage is shut (a private window, blocked site data); the document stays dark. */
			}
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!--
			The UI's faces (`@app/ui/theme.css`): Archivo for everything, Geist Mono for figures that
			align. The workbench's `index.html` loads the same.
		-->
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<title>App</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
