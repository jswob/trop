# Your Fly app's name: `fly apps create <name>`, then put it here.
app = "app-api"
primary_region = "fra"

[build]
  dockerfile = "../docker/api/Dockerfile"

[deploy]
  release_command = "bun src/db/migrate.ts"

[env]
  NODE_ENV = "production"
  API_PORT = "3000"
  # release_command has migrated before a machine starts, so the entrypoint goes straight to the
  # server: a start from zero does not wait on a migration check.
  MIGRATE_ON_START = "false"

[http_service]
  internal_port = 3000
  force_https = true
  # Suspend keeps a snapshot of the running machine, so a request after an idle spell resumes it in
  # a few hundred milliseconds where a stopped one boots from cold. The API holds nothing open
  # while idle (no polling, pooled database connections closed), so there is nothing stale to
  # resume into. A deploy or a host move discards the snapshot; the next start is then a cold one.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "10s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
