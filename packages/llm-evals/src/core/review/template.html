<title>Answer Key Review</title>
<style>
/* Layout: one column. Doubtful cases first, each a card with its options; agreed cases in one block below. */
:root {
	--bg: #f5f6fa; --surface: #ffffff; --ink: #171b2d; --muted: #5a627e; --line: #d4d8e5;
	--accent: #2748c9; --accent-soft: #e7ecfc; --ok: #1c8556; --ok-soft: #dcf2e7; --bad: #c2352b;
	--body: system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme='light']) {
		--bg: #0f121d; --surface: #171b2b; --ink: #e7e9f3; --muted: #9aa1bd; --line: #2b3148;
		--accent: #8ea4ff; --accent-soft: #1d2650; --ok: #4fc590; --ok-soft: #123526; --bad: #f27b70; color-scheme: dark;
	}
}
:root[data-theme='dark'] {
	--bg: #0f121d; --surface: #171b2b; --ink: #e7e9f3; --muted: #9aa1bd; --line: #2b3148;
	--accent: #8ea4ff; --accent-soft: #1d2650; --ok: #4fc590; --ok-soft: #123526; --bad: #f27b70; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.page { max-width: 820px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 96px; display: flex; flex-direction: column; gap: 28px; }
h1 { font-size: 28px; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 19px; margin: 0; }
p { margin: 0; max-width: 66ch; }
.muted { color: var(--muted); font-size: 14px; }
details { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface); }
summary { cursor: pointer; font-weight: 600; }
.guide { white-space: pre-wrap; font-size: 14.5px; margin-top: 10px; }
.list { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card.done { border-color: var(--ok); }
.head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.name { font-size: 18px; font-weight: 600; }
.tag { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.note { font-size: 14.5px; }
.options { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; font: inherit; color: inherit; background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.opt:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt[aria-pressed='true'] { border-color: var(--accent); background: var(--accent-soft); }
.opt .label { font-weight: 600; }
.opt .hint { font-size: 12.5px; color: var(--muted); }
.opt .preview { font-size: 14px; color: var(--muted); }
input[type='text'] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%; box-sizing: border-box; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: inherit; font-weight: 600; color: var(--surface); background: var(--accent); border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
.btn.quiet { color: var(--ink); background: var(--surface); border: 1px solid var(--line); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; align-items: center; font-size: 14px; }
.err { color: var(--bad); }
textarea { width: 100%; box-sizing: border-box; min-height: 120px; font-family: var(--mono); font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
</style>

<div class="page">
	<header>
		<h1 id="title"></h1>
		<p class="muted" id="sub"></p>
	</header>
	<div class="bar"><span id="tally"></span><span id="save">Connecting…</span></div>
	<details><summary>The labelling rules</summary><div class="guide" id="guide"></div></details>
	<section class="list" id="doubtfulSection">
		<h2>Needs your judgement</h2>
		<p class="muted">Nothing is pre-selected here. A suggestion, where there is one, is marked.</p>
		<div class="list" id="doubtful"></div>
	</section>
	<section class="list" id="agreedSection">
		<h2>Nothing in doubt</h2>
		<div class="row"><button class="btn" id="confirmAll" type="button">Confirm all of these</button><span class="muted" id="agreedCount"></span></div>
		<div class="list" id="agreed"></div>
	</section>
	<section class="list" id="fallback" hidden>
		<h2>Your picks</h2>
		<p class="muted">This view cannot save. Copy the picks and paste them to Claude.</p>
		<div class="row"><button class="btn quiet" id="copy" type="button">Copy picks</button></div>
		<textarea id="copyText" readonly></textarea>
	</section>
</div>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
(() => {
	const DATA = JSON.parse(document.getElementById('data').textContent);
	const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
	const items = [...DATA.doubtful, ...DATA.agreed];
	const byId = new Map(items.map(i => [i.id, i]));

	// picks: id -> { value, note }. value is the option, with its edited text after a colon.
	let picks = {};
	const unsent = {};
	let ref = null, docExists = false, chain = Promise.resolve(), timer = null;

	document.getElementById('title').textContent = `${DATA.title}: answer key review`;
	document.getElementById('sub').textContent = `Key version ${DATA.keyVersion}. Your picks save as you go; Claude reads them from this page.`;
	document.getElementById('guide').textContent = DATA.guide;
	document.getElementById('doubtfulSection').hidden = DATA.doubtful.length === 0;
	document.getElementById('agreedSection').hidden = DATA.agreed.length === 0;
	document.getElementById('agreedCount').textContent = `${DATA.agreed.length} cases`;

	const optionOf = value => String(value ?? '').split(':')[0];
	const textOf = value => { const at = String(value ?? '').indexOf(':'); return at === -1 ? null : String(value).slice(at + 1); };

	function cardHTML(item) {
		const pick = picks[item.id];
		const chosen = optionOf(pick?.value);
		const options = item.options.map(o => {
			const on = chosen === o.value;
			const hints = [o.value === item.current ? 'the key today' : '', o.value === optionOf(item.proposed) ? 'suggested' : ''].filter(Boolean).join(' · ');
			return `<button type="button" class="opt" data-v="${esc(o.value)}" aria-pressed="${on}">
				<span class="label">${esc(o.label)}${hints ? ` <span class="hint">${hints}</span>` : ''}</span>
				${o.preview ? `<span class="preview">${esc(o.preview)}</span>` : ''}
			</button>${on && o.text !== undefined ? `<input type="text" id="text-${esc(item.id)}" data-in="text" aria-label="Accepted forms" value="${esc(textOf(pick.value) ?? o.text)}">` : ''}`;
		}).join('');
		return `<div class="card${pick ? ' done' : ''}" data-id="${esc(item.id)}">
			<div class="head"><span class="name">${esc(item.title)}</span><span class="tag">${esc(item.source)}</span>${item.group ? `<span class="muted">${esc(item.group)}</span>` : ''}</div>
			${item.note ? `<div class="note">${esc(item.note)}</div>` : ''}
			<div class="options">${options}</div>
			<input type="text" id="note-${esc(item.id)}" data-in="note" placeholder="Comment (optional)" value="${esc(pick?.note ?? '')}">
		</div>`;
	}

	function paint(id) {
		const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
		if (!el) return;
		const active = document.activeElement?.id;
		const at = document.activeElement?.selectionStart;
		el.outerHTML = cardHTML(byId.get(id));
		if (active) { const again = document.getElementById(active); again?.focus(); if (at != null) again?.setSelectionRange?.(at, at); }
	}
	function paintAll() {
		document.getElementById('doubtful').innerHTML = DATA.doubtful.map(cardHTML).join('');
		document.getElementById('agreed').innerHTML = DATA.agreed.map(cardHTML).join('');
		tally();
	}
	function tally() {
		const done = items.filter(i => picks[i.id]).length;
		document.getElementById('tally').textContent = `${done} of ${items.length} decided`;
		document.getElementById('copyText').value = JSON.stringify(picks, null, 1);
	}

	const saveEl = document.getElementById('save');
	function setSave(text, err) { saveEl.textContent = text; saveEl.classList.toggle('err', !!err); }

	function setPick(id, pick, now) {
		if (pick) picks[id] = pick; else delete picks[id];
		unsent[id] = pick ?? null;
		tally();
		if (!ref) return;
		setSave('Saving…');
		clearTimeout(timer);
		timer = setTimeout(flush, now ? 0 : 700);
	}
	function flush() {
		const batch = { ...unsent };
		if (!Object.keys(batch).length) return;
		for (const k of Object.keys(batch)) delete unsent[k];
		chain = chain.then(async () => {
			try {
				if (docExists) await ref.update({ picks: batch, updatedAt: new Date().toISOString() });
				else { await ref.set({ picks: { ...picks }, updatedAt: new Date().toISOString() }); docExists = true; }
				if (!Object.keys(unsent).length) setSave('Saved');
			} catch (e) {
				Object.assign(unsent, batch, { ...unsent });
				setSave(e?.code === 'invalid_argument' ? 'Not saved: you can only read this page.' : 'Not saved. Your next pick will retry.', true);
			}
		});
	}

	document.querySelector('.page').addEventListener('click', e => {
		const btn = e.target.closest('.opt');
		if (!btn) return;
		const id = btn.closest('.card').dataset.id, item = byId.get(id), cur = picks[id];
		const option = item.options.find(o => o.value === btn.dataset.v);
		if (optionOf(cur?.value) === option.value) setPick(id, null, true);
		else setPick(id, { value: option.text !== undefined ? `${option.value}:${option.text}` : option.value, note: cur?.note ?? '' }, true);
		paint(id);
	});
	document.querySelector('.page').addEventListener('input', e => {
		const input = e.target.closest('[data-in]');
		if (!input) return;
		const id = input.closest('.card').dataset.id, cur = picks[id];
		if (input.dataset.in === 'text' && cur) setPick(id, { ...cur, value: `${optionOf(cur.value)}:${input.value}` });
		else if (input.dataset.in === 'note' && cur) setPick(id, { ...cur, note: input.value });
	});
	document.getElementById('confirmAll').addEventListener('click', () => {
		for (const item of DATA.agreed) {
			if (picks[item.id]) continue;
			const value = item.proposed ?? item.current;
			const option = item.options.find(o => o.value === optionOf(value));
			if (!option) continue;
			setPick(item.id, { value: value.includes(':') || option.text === undefined ? value : `${option.value}:${option.text}`, note: '' }, true);
		}
		paintAll();
	});
	document.getElementById('copy').addEventListener('click', async () => {
		const ta = document.getElementById('copyText');
		try { await navigator.clipboard.writeText(ta.value); document.getElementById('copy').textContent = 'Copied'; }
		catch { ta.focus(); ta.select(); }
	});

	paintAll();

	function noStore() { setSave('Not saving in this view.', true); document.getElementById('fallback').hidden = false; }
	if (!window.claude?.use) { noStore(); return; }
	window.claude.use('db').then(db => {
		if (!db) { noStore(); return; }
		ref = db.doc('review/picks');
		ref.onSnapshot(snap => {
			docExists = snap.exists;
			const stored = snap.exists ? (snap.data().picks ?? {}) : {};
			const next = {};
			for (const [id, p] of Object.entries(stored)) if (p && byId.has(id)) next[id] = { value: p.value, note: p.note ?? '' };
			for (const [id, p] of Object.entries(unsent)) { if (p) next[id] = p; else delete next[id]; }
			picks = next;
			if (!document.activeElement?.matches?.('input[type="text"]')) paintAll(); else tally();
			if (!Object.keys(unsent).length && saveEl.textContent === 'Connecting…') setSave(snap.exists ? 'Saved' : 'Picks save as you go');
		}, err => setSave(`Stopped syncing (${err.code}). Reload to reconnect.`, true));
	}, noStore);
})();
</script>
