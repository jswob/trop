name: Upstream

# A patch of a toolkit package reaching the default branch goes home: `toolkit upstream` opens or
# updates one pull request in the toolkit's repo per patched package, with a changeset, linking the
# commit that made the patch. That commit also sets the bump: mark a breaking fix `fix(kit)!:`.
# Running the workflow by hand takes every patch home again.
#
# It runs as the toolkit's GitHub App, installed on this repo and the toolkit's: the App's id in the
# TOOLKIT_APP_ID variable, its private key in the TOOLKIT_APP_KEY secret (docs/ci-cd.md). Without
# the variable the job is skipped.

on:
  push:
    branches: [main, master]
    paths: ['patches/@jswob*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  upstream:
    if: vars.TOOLKIT_APP_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ vars.TOOLKIT_APP_ID }}
          private-key: ${{ secrets.TOOLKIT_APP_KEY }}
          owner: jswob
          repositories: bun-monorepo
      # The whole history: each patch's message and bump come from the commit that last changed it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The whole history too: a patch names the blobs it was made against, which the three-way
      # replay needs when the toolkit moved on since that release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jswob/bun-monorepo
          token: ${{ steps.app.outputs.token }}
          path: toolkit-home
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Take the patches home
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.app.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.app.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com
        # git fetches and pushes from a worktree of the checkout, so the App's token goes in git's
        # global config rather than in that checkout's
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/jswob/bun-monorepo".insteadOf https://github.com/jswob/bun-monorepo
          bunx toolkit upstream --into toolkit-home --push
