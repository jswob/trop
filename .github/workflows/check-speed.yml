# The check-speed study's experiment (tmp/check-speed, 2026-11-12): today's `check full`
# timed step by step on a GitHub runner, and the same steps split into parallel jobs.
# On the study's branch only; never merged.
name: check-speed experiment

on:
  push:
    branches: [rules/check-speed]

permissions:
  contents: read

concurrency:
  group: check-speed-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  NIGHTLY: nightly-2026-10-21
  TOOLS: cargo-nextest@0.9.149 cargo-deny@0.20.2 ast-grep@0.51.0 cargo-fuzz@0.13.2 cargo-mutants@27.1.0 cargo-llvm-cov@0.9.1
  CARGO_BUILD_JOBS: 4
  NEXTEST_TEST_THREADS: 4

jobs:
  timed:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: selftest-shard-1, shard: 'R-82', cache: true }
          - { name: selftest-shard-2, shard: 'R-77', cache: true }
          - { name: selftest-shard-3, shard: 'R-51 R-8 R-9', cache: true }
          - { name: selftest-shard-4, shard: 'rest', cache: true }
          - { name: release-gating-half-1, half: '1', cache: true }
          - { name: release-gating-half-2, half: '2', cache: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo-tools
          key: engine-tools-${{ runner.os }}-${{ env.TOOLS }}
      - name: Install the toolchains and the cargo tools
        working-directory: engine
        run: |
          t0=$(date +%s)
          rustup toolchain install
          rustup toolchain install "$NIGHTLY" --profile minimal
          for tool in $TOOLS; do
            if [ ! -x "$HOME/.cargo-tools/bin/${tool%@*}" ]; then
              cargo install --locked --root "$HOME/.cargo-tools" "${tool%@*}" --version "${tool#*@}"
            fi
          done
          echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
          echo "{\"setup_tools_s\": $(( $(date +%s) - t0 ))}" >> "$RUNNER_TEMP/timing.jsonl"
      # the build outputs a pull request restores today (the newest nightly's engine/target)
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
            !engine/target/walls-green
            !engine/target/check-logs
            !engine/target/rules-selftest
            !engine/target/mutants
            !engine/target/mutants-local
          key: engine-build-${{ runner.os }}-${{ env.NIGHTLY }}-${{ hashFiles('engine/Cargo.lock', 'engine/rust-toolchain.toml') }}-none
          restore-keys: engine-build-${{ runner.os }}-${{ env.NIGHTLY }}-${{ hashFiles('engine/Cargo.lock', 'engine/rust-toolchain.toml') }}-
      - name: The steps, each timed
        if: ${{ !matrix.part && !matrix.shard && !matrix.half }}
        env:
          WT: ${{ github.workspace }}
        run: |
          set -o pipefail
          args="${{ matrix.mode }} ${{ matrix.fresh }} --out $RUNNER_TEMP/timing.jsonl"
          if [ -n "${{ matrix.steps }}" ]; then args="$args --steps ${{ matrix.steps }}"; fi
          python3 -I -B .github/check-speed/timed_check.py $args
      # T's gating tests in thirds (nextest's partitions), each job compiling its own dev build
      - name: A third of the gating tests
        if: ${{ matrix.part }}
        working-directory: engine
        env:
          PROPTEST_RNG_SEED: '20261022'
          PROPTEST_DISABLE_FAILURE_PERSISTENCE: '1'
          RUST_BACKTRACE: '1'
          CARGO_INCREMENTAL: '0'
        run: |
          set -o pipefail
          targets=$(python3 -I -B -c "import sys; sys.path.insert(0, 'tools'); import milestones, os; print(' '.join('--test=' + t for t in milestones.gating_targets(dict(os.environ))[1]))")
          t0=$(date +%s)
          cargo nextest run --locked -p tally-runner --all-features --no-run $targets
          t1=$(date +%s)
          cargo nextest run --locked -p tally-runner --all-features --partition ${{ matrix.part }} $targets 2>&1 | tail -n 5
          t2=$(date +%s)
          echo "{\"step\": \"gating ${{ matrix.part }}\", \"build_s\": $(( t1 - t0 )), \"run_s\": $(( t2 - t1 ))}" >> "$RUNNER_TEMP/timing.jsonl"
      # rules-selftest in shards: each the clean run, the ban coverage and its rules' cases
      - name: A rules-selftest shard, timed
        if: ${{ matrix.shard }}
        working-directory: engine
        run: |
          set -o pipefail
          rules="${{ matrix.shard }}"
          if [ "$rules" = rest ]; then
            rules=$(tools/rules-selftest/run --list | grep -vE 'review only|dropped at gate|NOTHING|the ban coverage$' | cut -d: -f1 | grep -vxE 'R-82|R-77|R-51|R-8|R-9' | tr '\n' ' ')
          fi
          echo "rules: $rules"
          t0=$(date +%s)
          tools/rules-selftest/run $rules 2>&1 | tail -n 6
          echo "{\"step\": \"rules-selftest ${{ matrix.shard }}\", \"s\": $(( $(date +%s) - t0 ))}" >> "$RUNNER_TEMP/timing.jsonl"
      # T's gating tests in the release-test profile, half of the test binaries per job (fat LTO kept)
      - name: Half of gating-release's binaries, timed
        if: ${{ matrix.half }}
        working-directory: engine
        env:
          PROPTEST_RNG_SEED: '20261022'
          PROPTEST_DISABLE_FAILURE_PERSISTENCE: '1'
          RUST_BACKTRACE: '1'
          CARGO_INCREMENTAL: '0'
        run: |
          set -o pipefail
          targets=$(python3 -I -B -c "import sys, os; sys.path.insert(0, 'tools'); import milestones; t = milestones.gating_targets(dict(os.environ))[1]; h = len(t) // 2; part = t[:h] if '${{ matrix.half }}' == '1' else t[h:]; print(' '.join('--test=' + x for x in part))")
          echo "targets: $targets"
          t0=$(date +%s)
          cargo nextest run --locked -p tally-runner --all-features --profile ci --cargo-profile release-test --no-run $targets
          t1=$(date +%s)
          cargo nextest run --locked -p tally-runner --all-features --profile ci --cargo-profile release-test $targets 2>&1 | tail -n 3
          t2=$(date +%s)
          echo "{\"step\": \"gating-release half ${{ matrix.half }}\", \"build_s\": $(( t1 - t0 )), \"run_s\": $(( t2 - t1 ))}" >> "$RUNNER_TEMP/timing.jsonl"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timing-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/timing.jsonl
            engine/target/check-logs/
            engine/target/rules-selftest/logs/
          retention-days: 14
