# The one clippy config for every crate in the engine's workspace. A rule file: only the
# `rules` role edits it, RULES.sha256 holds its checksum, and rules-selftest proves each
# ban fires (engine/SCAFFOLD.md). Rule ids R-n point to the approved rulebook.
# No entry carries allow-invalid (R-109).

# Tests may crash on purpose; they may not print (R-2, R-5, R-11)
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = false
allow-print-in-tests = false

# Thresholds and the consistency set (R-67, R-71)
avoid-breaking-exported-api = false
check-private-items = false
max-fn-params-bools = 0
# R-74: nesting is an error at depth 5 (excessive_nesting, denied in Cargo.toml)
excessive-nesting-threshold = 5
doc-valid-idents = [".."]

# R-4: an invariant is a real check that returns a refusal. Tests are linted in a second
# pass with this ban off (engine/tools/check).
disallowed-macros = [
  { path = "std::assert", reason = "R-4: crashes; return a refusal (ENGINE §9)" },
  { path = "std::assert_eq", reason = "R-4: crashes; return a refusal (ENGINE §9)" },
  { path = "std::assert_ne", reason = "R-4: crashes; return a refusal (ENGINE §9)" },
  { path = "std::debug_assert", reason = "R-4: crashes in debug builds only, so tests and releases differ" },
  { path = "std::debug_assert_eq", reason = "R-4: crashes in debug builds only, so tests and releases differ" },
  { path = "std::debug_assert_ne", reason = "R-4: crashes in debug builds only, so tests and releases differ" },
]

