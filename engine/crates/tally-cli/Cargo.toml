[package]
name = "tally-cli"
description = "The tally command: run(args, stdin) -> Output, and the binary around it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "tally"
path = "src/main.rs"
# The library is also `tally`: one doc page each would collide, and the binary has no API
doc = false

[dependencies]
tally = { workspace = true }

[lints]
workspace = true
