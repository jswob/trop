[package]
name = "tally"
description = "The Tally engine: reality in, result out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Breaks one invariant on demand, for DONE gate 5's ENGINE-INVARIANT test. It refuses
# to compile without debug assertions, so no release build can hold it (R-51).
fault-injection = []
# The work counters behind the CLI's --stats (D4-8, BUILDER §13.2): a build-side
# instrument, never in the shipped CLI. Off in release, guarded like fault-injection (R-51).
counters = []

[dependencies]
# Declared for the builder, unused by the stub (C §2 rule 6)
num-bigint = { workspace = true }
num-integer = { workspace = true }
num-traits = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

# The micro rows' wall time on the reference Mac (P8-M1 to P8-M3, R-91); engine/tools/perf
# runs each by its row's `bench:` recipe
[[bench]]
name = "p8_m1"
harness = false

[[bench]]
name = "p8_m2"
harness = false

[[bench]]
name = "p8_m3"
harness = false

[lints]
workspace = true
