# cargo-mutants (R-84 to R-88; DONE gate 8). A rule file: only the `rules` role edits it.
# The score counts T's tests only (R-84): the runner is the one test package.
test_package = ["tally-runner"]
test_tool = "nextest"
profile = "mutants"
# Strict lints must not reject a mutant before its tests run (R-88)
cap_lints = true
# The kernel's files. The lead sets them at milestone S from the builder's plan (R-85);
# check-rules then fails on any library file in neither this list nor the protected
# non-kernel list.
examine_globs = ["crates/tally/src/lib.rs"]
# No skip list of our own (R-86); the defaults only skip with_capacity's argument
skip_calls = []
# Hung mutants are ended, and counted as not caught (R-87, R-88)
timeout_multiplier = 3.0
minimum_test_timeout = 60.0
