# cargo-mutants (R-84 to R-88; DONE gate 8). A rule file: only the `rules` role edits it.
# The score counts T's tests only (R-84): the runner is the one test package. Since
# 2026-11-12 gate 8 runs through tools/mutants-gate (R-88, R-133): cargo-mutants lists the
# mutants from this file (`--list --json`), and the tool runs T's baseline itself (cargo-mutants
# 27.1.0 would run it on the mutated package, tally, which has no tests), then builds each
# mutant with this file's profile and cap_lints and runs the T tests that enter its function.
test_package = ["tally-runner"]
test_tool = "nextest"
profile = "mutants"
# The nextest profile for each mutant's tests: no retries, stop at the first failure and
# end the tests still running
additional_cargo_test_args = ["--profile=mutants"]
# Strict lints must not reject a mutant before its tests run (R-88)
cap_lints = true
# The kernel's files: tools/kernel.toml's `kernel`, set at milestone S from the builder's
# plan (R-85); check-rules fails when the two differ, and on any library file in neither
# that list nor the protected non-kernel list.
examine_globs = [
  "crates/tally/src/num/**",
  "crates/tally/src/read/**",
  "crates/tally/src/walk/**",
  "crates/tally/src/book/**",
  "crates/tally/src/hole/**",
]
# No skip list of our own (R-86); the defaults only skip with_capacity's argument
skip_calls = []
# Hung mutants are ended, and counted as not caught (R-87, R-88). No timeout is derived from
# a baseline: tools/mutants-gate sets them, 600 s for a mutant's tests and 600 s for its build
# (its TIMEOUT and BUILD_TIMEOUT), and engine.yml caps each shard's job at 45 minutes (R-88,
# 2026-11-12; until then `--timeout 600` on cargo-mutants' command lines, 300 before pick P72,
# 2026-11-11, and 24 shards' jobs capped at 300 minutes).
