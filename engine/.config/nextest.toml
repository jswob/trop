# cargo-nextest (R-88, R-90). A rule file: only the `rules` role edits it. No retries
# and no filters; a hung test is ended and fails.

[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
failure-output = "immediate-final"

[profile.mutants]
retries = 0
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 4 }
