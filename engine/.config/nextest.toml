# cargo-nextest (R-88, R-90). A rule file: only the `rules` role edits it. No retries
# and no filters; a hung test is ended and fails.

# the wrapper below (the mutants profile's memory cap) needs it at nextest 0.9.149
experimental = ["wrapper-scripts"]

[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
failure-output = "immediate-final"

# One test's own cap (issue #252, pick P35): fence F7's equivalence suite runs P8-L10's run
# `c1_r2` under both forms (Plans::Narrow and Plans::Whole, m4_narrow_c1_r2), 19.7 s on the
# Mac's release build and near the 300 s cap in CI's debug build (2 reds in 4 runs at the
# cap). A test is never split, retried or filtered out for its time alone (R-88), so this one
# test ends at 900 s instead; every other test keeps the 300 s above.
[[profile.default.overrides]]
filter = "binary_id(tally-runner::m4_narrow) & test(=tests::m4_narrow_c1_r2)"
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.ci.overrides]]
filter = "binary_id(tally-runner::m4_narrow) & test(=tests::m4_narrow_c1_r2)"
slow-timeout = { period = "60s", terminate-after = 15 }

# A mutant is caught at its first failing test, and the tests still running are ended
# then, not waited for (R-88; the user, 2026-11-06): a caught mutant took as long as its
# slowest running test
[profile.mutants]
retries = 0
fail-fast = { max-fail = 1, terminate = "immediate" }
slow-timeout = { period = "30s", terminate-after = 4 }

# Each mutant's test process runs under a memory cap (R-88, issue #40): past 2048 MB it is
# killed, exits 86 and says so on stderr, so a mutant that allocates without bound ends
# there instead of taking the machine down. T's tests peak near 160 MB unmutated; four run
# at once on a 16 GB GitHub runner. The tests only: cargo and rustc run outside it.
[scripts.wrapper.memcap]
command = { command-line = "tools/test-memcap 2048", relative-to = "workspace-root" }

[[profile.mutants.scripts]]
filter = "all()"
run-wrapper = "memcap"
