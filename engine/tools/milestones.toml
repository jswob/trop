# The milestone marker (R-77, R-84; engine/tests/MILESTONE-S.md, "Keeping master green";
# issue #14). A rule file: only the `rules` role edits it, through R-112.
#
# Each milestone's Rust tests are a `tally-runner` test target named for it (`s_properties`,
# then `m0_…`, `m5a_…`) with `test = false`: red until the milestone is built, so a plain
# run leaves them out. A milestone in `gating` has its tests run as failing steps by
# `check commit`, `check full`, CI and the mutants run (not by `check quick`, since
# 2026-11-16); the first milestone not in it is reported (`S: 3/7 green`), never failing.
#
# The rules role adds a milestone to `gating` in the commit right after the gate session
# tags it ("marker at the tag", the user's choice at T1's gate G-T, 2026-10-31): within a
# milestone the builder's pull requests land while its tests are partly red, and once it
# is tagged they never go red again. `gating` is always the first milestones in build
# order. S is the exception (issue #26, 2026-11-02, "S in gating, last commit"): it joins
# `gating` in the last commit of build/s, so it gates from its merge and S's mutants run
# counts its tests. M0 likewise (issue #56, G-M0, 2026-11-04, "gating: Yes, last commit"):
# it joins in the last commit of build/m0. M1 likewise (issue #108, 2026-11-11, under those
# words and the M1 brief): it joins in build/m1's commit before its gate, all 84 tests green;
# the gate's fixes may follow it on the branch. M2 likewise (issue #167, 2026-11-15, under those
# words and the M2 brief): it joins in build/m2's commit before its gate, all its tests green;
# the gate's fixes may follow it on the branch. M3 likewise (issue #226, 2026-11-19, under those
# words and the M3 brief): it joins in build/m3's commit before its gate, all 36 tests green;
# the gate's fixes may follow it on the branch. M4 likewise (issue #252, 2026-11-23, under those
# words and the M4 brief): it joins in the rules step's last commit before its gate, 47 of its 49
# tests green there; the two red (m4_fixes_p23, m4_fixes_traced) are G3's last turn's, green or
# held before the gate.

# BUILD-ORDER's milestones, in build order (as engine/tests/map/placement.py's ORDER)
milestones = ["S", "M0", "M1", "M2", "M3", "M4", "M5a", "M5b", "M5c", "M6", "M7", "M8", "M9"]
# the milestones whose tests gate
gating = ["S", "M0", "M1", "M2", "M3", "M4"]
# the gating targets a mutation run leaves out, from its build as well as its run (R-84,
# R-88; the user, 2026-11-06, "Yes, approve it, add it to the 2.1.6 brief"): M0's load
# tests exercise load, not the kernel, and took about 55 % of each shard's time; of run
# 42138863547's 1 229 caught mutants they alone caught 3, for which T adds direct
# tests (the 2.1.6 round). They still run in `check` and CI's test jobs
mutants_leave_out = ["m0_load"]
# The fences' equivalence tests (R-130), catchers of a local mutation batch only, with
# `mutants-local --fences` (R-88; pick P55, issue #108, 2026-11-09): once a fence answers T's
# reads, only its equivalence test reaches its plain twin. Not the mutants shards' or their
# baseline's: gate 8 counts T's tests only (R-84). Each entry names a package and a test
# target (every test in it) or a module of its lib (the tests under it).
fence_catchers = [
  # F5 (walk/lows.rs): the tree against the projection's walk on T's corpora, byte for byte
  { package = "tally-cli", test = "walk_oracle" },
  { package = "tally", lib = "walk::lows::tests::" },
  # F6 (walk/fork.rs): the walk read again from its kept checkpoint against the fresh walk
  { package = "tally-cli", test = "fork_oracle" },
  { package = "tally", lib = "walk::fork::tests::" },
  # F7 (walk/narrow.rs, M4's G6c; P8-L10): the narrow read against the whole list
  # (Plans::Narrow against Plans::Whole), T's m4_narrow on every `run` store and corpus, F7's
  # realities, c1_r2 and P8-14 under both (pick P27 on #252: its one equivalence suite, no
  # CLI narrow_oracle), and the module's own tests
  { package = "tally-runner", test = "m4_narrow" },
  { package = "tally", lib = "walk::narrow::tests::" },
]
# The test targets that run by default which `check quick` leaves out and `check commit`
# runs (R-82; the user's "I agree to chagnes 1,2 and 3", 2026-11-16, on the process study
# after M2): the fences' equivalence suites, 97 % of quick's test time in M2. A fence's suite
# joins by its line here; `engine/tools/check fences` runs them alone, for a builder working
# on a fence. Each entry names a package and a test target that runs by default.
quick_leaves_out = [
  { package = "tally-cli", test = "walk_oracle" },     # F5, the CLI's
  { package = "tally-cli", test = "fork_oracle" },     # F6, the CLI's
  { package = "tally-runner", test = "m2_forks" },     # F6 on every store and corpus, T's
  { package = "tally-runner", test = "m4_narrow" },    # F7 on every store and corpus, T's (P27)
]
# An entry here or in `fence_catchers` may say what it `waits` for (`waits = "…"`): a suite
# named before its group writes it, left out until cargo metadata lists the target (here: and
# runs it by default), then taken with no rules step between (M4's rules step, pick P17).
# The gating targets' tests `check quick` runs too, each by a nextest filter that keeps every
# other target's tests, while `check commit` runs the whole target as before (R-82; tally
# 2.3's pick P12 on #247, 2026-11-22, under the user's standing rule of 2026-11-04): the pin
# oracle's fixed tenth, 0.16 s, so an edit that moves a pinned day's answer is seen at once.
# An entry names a target of a gating milestone and one test in it; it is inert until cargo
# metadata shows the runner holds the target (T writes it on its own branch).
quick_takes = [
  { target = "m3_oracle", test = "m3_oracle_tenth" },
]
