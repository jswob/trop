# The budget table: PERFORMANCE §8's P8 rows, machine-readable (BUILDER §13.3; plan B2.3).
# engine/tools/perf reads it for wall time, footprint and instruction limits; T's runner
# reads it for the count budgets. A protected file: the rules role writes it, from the
# spec's rows only (PERFORMANCE §8). S fixed P8-14's wall, footprint and def misses and
# P8-M1..P8-M3 (D4-6, 2026-11-02; tally 2.1.2); P8-M4's budget moved to M1; every other
# number stays proposed until the milestone that measures it. A fixed number changes only
# through a logged row; an instruction limit is only lowered, except a re-baseline at a
# toolchain bump (D4-2, R-97).
#
# Each [[row]]:
#   id, group (I, C, L, M), what: PERFORMANCE §8's row, shortened
#   recipe: how perf runs it
#     "check:<id>"   one row of engine/tests/checks.tsv, run as run.py runs it
#     "bench:<name>" a gungraun bench in engine/tools/gungraun/benches/ (Linux CI), and its
#                    criterion twin in crates/tally/benches/ for the Mac's wall time, if any
#     "test:<target> <name>…"  T's runner tests that hold the row's law (P8-9); they pass or
#                    fail, never timed: check's `gating` step runs them from their
#                    milestone's marker (R-77), and perf only names them
#     "waits: ..."   nothing runs it yet; the text says what it waits for
#   wall_s, footprint_mb, workers: the Mac's budget (absent: the row sets none)
#   less: a micro row's criterion bench id whose median is subtracted from its own (P8-M4:
#         the run with the projection less the plain run; pick P56, 2026-11-09)
#   counts: the count budgets T's runner checks at 1 worker (absent: reported only)
#   instructions: the gungraun hard limit on Ir, from its first Linux measurement x 1.2
#                 (absent: no limit yet; the bench still runs and reports its count)
#   blocks: "pr" (counts and instructions, Linux CI) or "tag" (wall and footprint, the Mac)

