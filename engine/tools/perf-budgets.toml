# The budget table: PERFORMANCE §8's P8 rows, machine-readable (BUILDER §13.3; plan B2.3).
# engine/tools/perf reads it for wall time, footprint and instruction limits; T's runner
# reads it for the count budgets. A protected file: the rules role writes it, from the
# spec's rows only, and every number is proposed until S (PERFORMANCE §8). A number set
# at S changes only through a logged row; an instruction limit is only lowered, except a
# re-baseline at a toolchain bump (D4-2, R-97).
#
# Each [[row]]:
#   id, group (I, C, L, M), what: PERFORMANCE §8's row, shortened
#   recipe: how perf runs it
#     "check:<id>"   one row of engine/tests/checks.tsv, run as run.py runs it
#     "bench:<name>" a gungraun bench in engine/tools/gungraun/benches/ (Linux CI), and its
#                    criterion twin in crates/tally/benches/ for the Mac's wall time, if any
#     "waits: ..."   nothing runs it yet; the text says what it waits for
#   wall_s, footprint_mb, workers: the Mac's budget (absent: the row sets none)
#   counts: the count budgets T's runner checks at 1 worker (absent: reported only)
#   instructions: the gungraun hard limit on Ir, set at S (absent until then)
#   blocks: "pr" (counts and instructions, Linux CI) or "tag" (wall and footprint, the Mac)

