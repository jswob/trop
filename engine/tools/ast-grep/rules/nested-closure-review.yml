id: nested-closure-review
language: rust
severity: warning
message: 'R-125 (report): a closure inside a closure, listed for review: each closure a single expression, none nested'
files:
  - 'crates/*/src/**/*.rs'
utils:
  in-test-module:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: '^#\[cfg\(test\)\]$'
        stopBy:
          not:
            any:
              - kind: attribute_item
              - kind: line_comment
              - kind: block_comment
rule:
  kind: closure_expression
  inside:
    kind: closure_expression
    stopBy: end
  not:
    matches: in-test-module
