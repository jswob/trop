id: env-macro-only-package-version
language: rust
severity: error
message: 'R-48: nothing is taken from the build machine; env! reads only CARGO_PKG_NAME and CARGO_PKG_VERSION'
rule:
  all:
    - kind: macro_invocation
      regex: "^(::)?(std::|core::)?(option_env|env)\\s*!"
    - not:
        regex: "^(::)?(std::|core::)?(option_env|env)\\s*!\\s*\\(\\s*\"CARGO_PKG_(NAME|VERSION)\"\\s*\\)$"
