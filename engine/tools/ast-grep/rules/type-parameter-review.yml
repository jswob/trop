id: type-parameter-review
language: rust
severity: warning
message: 'R-124 (report): an own type parameter (a generic), listed for review: one of each thing needs no generic'
note: "A type or const parameter in <...> on a fn, struct, enum, union, type alias, impl or trait, and impl Trait in a parameter's type (a type parameter without a name). Lifetimes are lifetime-review's."
files:
  - 'crates/*/src/**/*.rs'
utils:
  in-test-module:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: '^#\[cfg\(test\)\]$'
        stopBy:
          not:
            any:
              - kind: attribute_item
              - kind: line_comment
              - kind: block_comment
rule:
  any:
    - kind: type_parameter
      inside:
        kind: type_parameters
    - kind: const_parameter
      inside:
        kind: type_parameters
    - kind: abstract_type
      inside:
        kind: parameters
        stopBy: end
  not:
    matches: in-test-module
