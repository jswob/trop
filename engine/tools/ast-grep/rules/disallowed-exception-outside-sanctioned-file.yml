id: disallowed-exception-outside-sanctioned-file
language: rust
severity: error
message: 'R-108: exceptions to the ban lists (I/O, environment, threads, big-integer types) live only in the files the lead sanctions'
note: 'Sanctioned at the scaffold: crates/tally-cli/src/main.rs. The lead adds the thread module and the kernel files at S.'
files:
  - 'crates/**/*.rs'
ignores:
  - 'crates/tally-cli/src/main.rs'
rule:
  any:
    - kind: attribute_item
    - kind: inner_attribute_item
  regex: "\\b(expect|allow)\\s*\\([^\\]]*disallowed_(methods|types|macros)"
