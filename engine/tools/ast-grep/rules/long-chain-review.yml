id: long-chain-review
language: rust
severity: warning
message: 'R-125 (report): a chain of 5 or more method calls, listed for review: about 4 steps at most, then a named function or a loop'
note: "Counts the .name(..) calls along one chain (turbofish and ? between them included); the chain's first receiver, a call like Foo::new(), isn't counted. One hit per chain, on its last call."
files:
  - 'crates/*/src/**/*.rs'
utils:
  in-test-module:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: '^#\[cfg\(test\)\]$'
        stopBy:
          not:
            any:
              - kind: attribute_item
              - kind: line_comment
              - kind: block_comment
  # a method call: x.f(..) or x.f::<T>(..)
  method-call:
    kind: call_expression
    has:
      field: function
      any:
        - kind: field_expression
        - kind: generic_function
          has:
            field: function
            kind: field_expression
  # the nodes a chain runs through, from a call down to its receiver; anything else ends it
  off-chain:
    not:
      any:
        - kind: call_expression
        - kind: field_expression
        - kind: generic_function
        - kind: try_expression
rule:
  matches: method-call
  has:
    stopBy:
      matches: off-chain
    matches: method-call
    has:
      stopBy:
        matches: off-chain
      matches: method-call
      has:
        stopBy:
          matches: off-chain
        matches: method-call
        has:
          stopBy:
            matches: off-chain
          matches: method-call
  not:
    any:
      - inside:
          stopBy:
            matches: off-chain
          matches: method-call
      - matches: in-test-module
