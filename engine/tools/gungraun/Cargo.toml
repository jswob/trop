# The instruction benches (D4-2, BUILDER §13.3): gungraun 0.20.0 under Valgrind 3.28.0, on
# Linux CI only. A crate apart from the engine's workspace, so no Mac build fetches or
# compiles gungraun (session 8c, rule 3). A protected instrument: the lead writes the benches
# on the builder's request (R-91), and their hard limits come from tools/perf-budgets.toml
# through `engine/tools/perf limits`, on the command line, so a bench file can't loosen
# them. Its lock is committed (seeded from the engine's, issue #26), so `check full` compiles
# the benches `--locked` on any machine, without Valgrind (`gungraun-build`).

[package]
name = "tally-gungraun"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
tally = { path = "../../crates/tally" }

[dev-dependencies]
gungraun = "=0.20.0"

# The micro rows' instruction counts (P8-M1 to P8-M3), each limited by its row
[[bench]]
name = "p8_m1"
harness = false

[[bench]]
name = "p8_m2"
harness = false

[[bench]]
name = "p8_m3"
harness = false

# its own workspace, apart from the engine's
[workspace]
