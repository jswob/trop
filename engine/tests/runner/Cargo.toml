[package]
name = "tally-runner"
description = "T's test runner: the engine run in process against T's vectors and properties"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tally-cli = { workspace = true }

# The planted fault of `tally_cli::run_faulted` (INTERFACE §4; the coordinator's pick P8), for
# `m1_invariant` alone (`required-features`), so no other build of the runner has it.
[features]
fault-injection = ["tally-cli/fault-injection"]
# The work counters behind `--stats` (R-51, BUILDER §13.2), for `m2_counts` alone
# (`required-features`): fence F6's counts, days stepped and walks shared (pick P75's addendum).
counters = ["tally-cli/counters"]

[lints]
workspace = true

# Each milestone's tests on the engine are test targets named for it, red until the
# milestone is built, so not run by default (`test = false`). The marker
# engine/tools/milestones.toml (R-77, R-84) gates a milestone's targets once its gate session
# tags it; until then `check` runs the next milestone's as a report that never fails
# (MILESTONE-S.md, "Keeping master green"). Run one by name, e.g.
# cargo nextest run -p tally-runner --test s_household

# S: the kernel's properties (PROPERTIES.md; MILESTONE-S.md row 3)
[[test]]
name = "s_properties"
path = "milestone/s_properties.rs"
test = false

# S: X's base asks against HH4's hand-checked vectors (hh4/vectors.tsv; MILESTONE-S.md row 4)
[[test]]
name = "s_household"
path = "milestone/s_household.rs"
test = false

# S: the kernel's vectors and the corpus, whole output against refcore's bytes (kernel/vectors.refcore;
# MILESTONE-S.md row 5, issue #41)
[[test]]
name = "s_kernel"
path = "milestone/s_kernel.rs"
test = false

# M0: the fixtures of the codes no check prints, LOAD-PATH first (codes/fixtures.tsv; gate 5)
[[test]]
name = "m0_codes"
path = "milestone/m0_codes.rs"
test = false

# M0: the format, refcore's reprint of every text set and the round trip (m0/format.refcore;
# MILESTONE-M0.md row 4; gate 6)
[[test]]
name = "m0_format"
path = "milestone/m0_format.rs"
test = false

# M0: the load, refcore's run of the load probe over every text set and row 1's 10 refusals
# (m0/load.refcore; MILESTONE-M0.md rows 1 and 2)
[[test]]
name = "m0_load"
path = "milestone/m0_load.rs"
test = false

# M0: tools/loadcheck.py agrees with the loader over the 79 models, the household and the
# changes (m0/loadcheck.refcore; MILESTONE-M0.md row 3)
[[test]]
name = "m0_loadcheck"
path = "milestone/m0_loadcheck.rs"
test = false

# M0: the format's and the loader's laws on a seeded corpus (properties/m0.corpus,
# properties/m0.refcore; PROPERTIES.md § M0; MILESTONE-M0.md row 7)
[[test]]
name = "m0_properties"
path = "milestone/m0_properties.rs"
test = false

# M1: the checks of BUILD-ORDER § M1 that s_kernel doesn't hold, refcore's whole output for
# each (m1/vectors.refcore; MILESTONE-M1.md row 1), one test per builder group
[[test]]
name = "m1_checks"
path = "milestone/m1_checks.rs"
test = false

# M1: a canonical text reprints as itself, on #109's text (m1/format/; MILESTONE-M1.md row 7)
[[test]]
name = "m1_format"
path = "milestone/m1_format.rs"
test = false

# M1: the prototype's goldens and pins restated in tally 2 (GOLDENS.md; MILESTONE-M1.md row 2)
[[test]]
name = "m1_goldens"
path = "milestone/m1_goldens.rs"
test = false

# M1: a fixture for each code and message form of M1's constructs no other output prints
# (codes/m1/; MILESTONE-M1.md row 3)
[[test]]
name = "m1_codes"
path = "milestone/m1_codes.rs"
test = false

# M2: a fixture for each code and message form of M2's constructs no other output prints
# (codes/m2/; MILESTONE-M2.md row 4); `test = false` until M2 gates
[[test]]
name = "m2_codes"
path = "milestone/m2_codes.rs"
test = false

# M1: the items the pre-M1 run left for M1 (m1/carried/; MILESTONE-M1.md row 6)
[[test]]
name = "m1_carried"
path = "milestone/m1_carried.rs"
test = false

# M1: the builder groups' review fixes (m1/fixes/; MILESTONE-M1.md row 8)
[[test]]
name = "m1_fixes"
path = "milestone/m1_fixes.rs"
test = false

# M1: the properties of M1 on a seeded corpus (properties/m1.corpus; PROPERTIES.md § M1;
# MILESTONE-M1.md row 4)
[[test]]
name = "m1_properties"
path = "milestone/m1_properties.rs"
test = false

# M1: fence F5 on T's realities, the tree against its twin through the CLI's re-export of the
# library (picks P57, P59; MILESTONE-M1.md row 9)
[[test]]
name = "m1_lows"
path = "milestone/m1_lows.rs"
test = false

# M1: the ENGINE-INVARIANT fixture under the planted fault (codes/m1_invariant.refcore; rules
# turn 2's R1; MILESTONE-M1.md row 3)
[[test]]
name = "m1_invariant"
path = "milestone/m1_invariant.rs"
test = false
required-features = ["fault-injection"]

# M2: the checks of BUILD-ORDER § M2 that s_kernel doesn't hold, refcore's whole output for
# each (m2/vectors.refcore; MILESTONE-M2.md row 1), one test per builder group
[[test]]
name = "m2_checks"
path = "milestone/m2_checks.rs"
test = false

# Milestone M2's in-scope items (issue #167, MILESTONE-M2.md row 6): `test = false` until M2
# is in tools/milestones.toml's `gating`, as m2_checks.
[[test]]
name = "m2_items"
path = "milestone/m2_items.rs"
test = false

# Milestone M2's review fixes and refcore's misses (issue #167, MILESTONE-M2.md row 8): the held
# vectors' groups and the spec's answers (m2/spec.vectors); `test = false` until M2 gates.
[[test]]
name = "m2_fixes"
path = "milestone/m2_fixes.rs"
test = false

# Milestone M2's goldens (issue #167, #114, GOLDENS.md): the bank history's goldens over
# m2/bank/; `test = false` until M2 gates.
[[test]]
name = "m2_goldens"
path = "milestone/m2_goldens.rs"
test = false

# Milestone M2's hindcasts (issue #167, DONE gate 4, hindcast.md): the fixtures H0-H5, H8, H9
# over m2/hindcast/; `test = false` until M2 gates.
[[test]]
name = "m2_hindcasts"
path = "milestone/m2_hindcasts.rs"
test = false

# Milestone M2's properties (issue #167, DONE gate 6, PROPERTIES.md § M2): masking at K, the
# replay's split, the fixed past over properties/m2.corpus; `test = false` until M2 gates.
[[test]]
name = "m2_properties"
path = "milestone/m2_properties.rs"
test = false

# M2: fence F6 on every store and corpus, the forks switch on against off through the CLI's
# re-export of the library (pick P9; MILESTONE-M2.md row 5): a fence's equivalence test
# (R-130), run by default since G7 built the switch (9f98aa56).
[[test]]
name = "m2_forks"
path = "milestone/m2_forks.rs"

# M2: fence F6's counts on fixed inputs, forks on and off (issue #167, gate 8 run 43749994847,
# the builder's R1-R7 and T5; MILESTONE-M2.md row 5): the counters build only (R-51), as
# m1_invariant takes the fault; `test = false`, gating with M2.
[[test]]
name = "m2_counts"
path = "milestone/m2_counts.rs"
test = false
required-features = ["counters"]

# M3: `check` (OPERATIONS.md §2.3) on M0's 315 text sets and the fixtures of m3/check/
# (m3/check.vectors, predicted from refcore's run until refcore's check confirms it, pick P8;
# MILESTONE-M3.md rows 2 and 3); `test = false` until M3 gates.
[[test]]
name = "m3_check"
path = "milestone/m3_check.rs"
test = false
